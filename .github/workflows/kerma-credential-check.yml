name: Kerma credential safety checks
on:
  push:
    branches:
      - fix/hikvision-credential-validity-20261012
  pull_request:
    paths:
      - 'backend/server.py'
      - 'frontend/src/pages/Employees.jsx'
      - 'tests/test_credential_validity.py'
      - '.github/workflows/kerma-credential-check.yml'

jobs:
  validity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install unit-test dependencies
        run: python -m pip install pytest fastapi
      - name: Validate Python syntax and credential validity
        run: |
          python -m py_compile backend/server.py scripts/diagnose_hikvision_card.py
          python -m pytest -q tests/test_credential_validity.py

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock
      - name: Enable yarn
        run: corepack enable
      - name: Install frontend dependencies
        working-directory: frontend
        run: yarn install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: yarn build
